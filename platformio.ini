; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
include_dir = .
default_envs = 
	bluepill_f103c8
	wemos_d1_mini32

[env]
lib_deps = 
	; DCC-EX/DCCEXProtocol@^1.3.2
	; To use a local copy of the library, update the below path to suit
	; This does not install/cache in PIO but just links to it
	symlink:///home/pete/code/DCCEXProtocol
build_flags = 
	-std=c++17 -Os -g2
	-Wall

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
build_flags = 
	${env.build_flags}
	-DSERIAL_RX_BUFFER_SIZE=256
	-DSERIAL_TX_BUFFER_SIZE=256
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-DUSBCON
	-DHAL_PCD_MODULE_ENABLED
	-DUSBD_VID=0x0483
	-DUSBD_PID=0x5740
	-DUSB_MANUFACTURER="Unknown"
	-DUSB_PRODUCT="\"BLUEPILL_F103C8\""
lib_deps = 
	${env.lib_deps}
monitor_speed = 115200
monitor_echo = yes

[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
lib_deps = 
	${env.lib_deps}
monitor_speed = 115200
monitor_echo = yes
build_flags = 
	${env.build_flags}
